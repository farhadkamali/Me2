plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.5.0")
    implementation "com.google.firebase:firebase-messaging"
}

android {
    namespace "ir.vamkamali.members"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId "ir.vamkamali.members"
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty("versionCode") ?: "1").toInteger()
        versionName "1.0." + (project.findProperty("versionCode") ?: "1")
    }
}