<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وام کمالی - مدیریت</title><style>body{font-family:Tahoma,Arial;background:#f3f6fb;color:#172033;margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #15264a12}h1{color:#174ea6}label{display:block;margin:12px 0 6px}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #ccd5e2;border-radius:9px;width:100%;box-sizing:border-box}button{background:#174ea6;color:white;border:0;margin-top:12px;cursor:pointer}.muted{color:#65738b;font-size:13px}.item{border-bottom:1px solid #e5eaf2;padding:12px 0}</style></head><body><main class="wrap"><h1>وام کمالی | پنل مدیریت</h1><p class="muted">نمونه آزمایشی — اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</p><section class="card"><h2>ثبت درخواست آزمایشی</h2><label>نام نمایشی</label><input id="name" placeholder="نام نمونه"><label>نوع درخواست</label><select id="kind"><option>استعلام وام</option><option>پیگیری درخواست</option><option>سایر</option></select><label>توضیحات</label><textarea id="note" placeholder="توضیحات غیرحساس"></textarea><button id="add">ثبت در این دستگاه</button></section><section class="card"><h2>درخواست‌های ذخیره‌شده</h2><div id="list"></div><button id="clear">پاک کردن درخواست‌های نمونه</button></section></main><script>const key='vamKamaliManagerDemo';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){let a=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('list').innerHTML=a.length?a.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.name)}</b><p>${esc(x.kind)}</p><p>${esc(x.note)}</p></div>`).join(''):'هنوز درخواستی ثبت نشده است.'}document.getElementById('add').onclick=()=>{let name=document.getElementById('name').value.trim();if(!name){alert('نام نمایشی را وارد کن');return}let a=JSON.parse(localStorage.getItem(key)||'[]');a.unshift({name,kind:document.getElementById('kind').value,note:document.getElementById('note').value.trim()});localStorage.setItem(key,JSON.stringify(a));document.getElementById('name').value='';document.getElementById('note').value='';load()};document.getElementById('clear').onclick=()=>{if(confirm('درخواست‌های آزمایشی همین دستگاه پاک شوند؟')){localStorage.removeItem(key);load()}};load();</script></body></html>
