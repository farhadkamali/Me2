name: Build Vam Kamali APKs

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/purchase-request-manager-inbox", "feature/purchase-form-contact-success", "member-ui-refresh"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK paths
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate PHP and JavaScript
        run: |
          php -l backend/api/index.php
          node --check members-app/app/src/main/assets/member-refresh.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, output in [
              ("members-app/app/src/main/assets/index.html", "/tmp/member-inline.js"),
              ("manager-app/app/src/main/assets/index.html", "/tmp/manager-inline.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              Path(output).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/member-inline.js
          node --check /tmp/manager-inline.js

      - name: Build members APK
        working-directory: members-app
        run: gradle assembleDebug

      - name: Build manager APK
        working-directory: manager-app
        run: gradle assembleDebug

      - name: Upload members APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-members-apk
          path: members-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-manager-apk
          path: manager-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/member-ui-refresh' && contains(github.event.head_commit.message, '[publish-release]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download members APK
        uses: actions/download-artifact@v4
        with:
          name: vam-kamali-members-apk
          path: dist/members
      - name: Download manager APK
        uses: actions/download-artifact@v4
        with:
          name: vam-kamali-manager-apk
          path: dist/manager
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: وام کمالی نسخه ۱.۰.۰
          target_commitish: member-ui-refresh
          generate_release_notes: true
          files: |
            dist/members/app-debug.apk
            dist/manager/app-debug.apk
