name: Build Manager APK

on:
  push:
    branches: [main]
    paths:
      - "manager-app/**"
      - ".github/workflows/build-manager-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build manager debug APK
        working-directory: manager-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-manager-debug-apk
          path: manager-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
