name: Build Vam Kamali APKs

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/member-registration-phone"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK paths
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up PHP for API syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate backend PHP syntax
        run: php -l backend/api/index.php

      - name: Validate app JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for path in ["members-app/app/src/main/assets/index.html", "manager-app/app/src/main/assets/index.html"]:
              html = Path(path).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {path}")
              Path("/tmp/check.js").write_text("\\n".join(scripts), encoding="utf-8")
              import subprocess
              subprocess.run(["node", "--check", "/tmp/check.js"], check=True)
              print(f"JavaScript syntax OK: {path}")
          PY

      - name: Build members APK
        working-directory: members-app
        run: gradle assembleDebug

      - name: Build manager APK
        working-directory: manager-app
        run: gradle assembleDebug

      - name: Upload members APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-members-apk
          path: members-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-manager-apk
          path: manager-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
