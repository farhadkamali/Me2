name: Build Vam Kamali APKs

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/purchase-request-manager-inbox", "feature/purchase-form-contact-success", "member-ui-refresh"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK paths
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate PHP and JavaScript
        run: |
          php -l backend/api/index.php
          node --check members-app/app/src/main/assets/member-refresh.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, output in [
              ("members-app/app/src/main/assets/index.html", "/tmp/member-inline.js"),
              ("manager-app/app/src/main/assets/index.html", "/tmp/manager-inline.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              Path(output).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/member-inline.js
          node --check /tmp/manager-inline.js
      - name: Build members debug APK (test artifact only)
        working-directory: members-app
        run: gradle assembleDebug -PversionCode=${GITHUB_RUN_NUMBER}
      - name: Build manager debug APK
        working-directory: manager-app
        run: gradle assembleDebug
      - name: Upload members debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-members-debug-apk
          path: members-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: vam-kamali-manager-apk
          path: manager-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-members-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/member-ui-refresh' && secrets.ANDROID_KEYSTORE_BASE64 != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vamkamali-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vamkamali-release.jks" >> "$GITHUB_ENV"
      - name: Build signed members APK
        working-directory: members-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${GITHUB_RUN_NUMBER}
      - name: Publish members APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: وام کمالی نسخه پایدار
          target_commitish: member-ui-refresh
          generate_release_notes: true
          overwrite_files: true
          files: members-app/app/build/outputs/apk/release/app-release.apk
